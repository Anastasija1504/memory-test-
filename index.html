<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест на пам’ять</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #5b86e5, #36d1dc);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  #game {
    max-width: 500px;
    margin: auto;
    background: rgba(0,0,0,0.25);
    padding: 20px;
    border-radius: 20px;
  }

  input, button {
    padding: 10px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    margin: 10px;
  }

  input {
    width: 80%;
    text-align: center;
  }

  button {
    background: #fff;
    color: #333;
    cursor: pointer;
    transition: background 0.3s;
  }

  button:hover {
    background: #f0f0f0;
  }

  #number {
    font-size: 60px;
    font-weight: bold;
    margin: 20px 0;
    transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
  }

  .fade {
    opacity: 0;
    transform: scale(0.7);
  }

  @media (max-width: 600px) {
    #number { font-size: 42px; }
    input, button { font-size: 14px; }
  }

  #feedback {
    font-size: 20px;
    margin-top: 10px;
    min-height: 30px;
  }

  .correct { color: #00ffb3; }
  .wrong { color: #ff8080; }
</style>
</head>
<body>
  <div id="game">
    <h1>🧠 Тест на пам’ять</h1>
    <div id="intro">
      <p>Введи своє ім’я:</p>
      <input type="text" id="username" placeholder="Твоє ім’я">
      <br>
      <button id="startBtn">Почати</button>
    </div>

    <div id="level" style="display:none;">
      <h2 id="levelInfo"></h2>
      <div id="number"></div>
      <input id="answer" type="text" placeholder="Введи цифри у зворотному порядку" disabled>
      <br>
      <button id="submitBtn" disabled>Відповісти</button>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

<script>
const totalLevels = 5;
const attemptsPerLevel = 3;
let currentLevel = 1;
let currentAttempt = 1;
let score = 0;
let totalAttempts = totalLevels * attemptsPerLevel;
let currentNumber = "";
let username = "";

document.getElementById("startBtn").onclick = startGame;
document.getElementById("submitBtn").onclick = checkAnswer;

function startGame() {
  username = document.getElementById("username").value.trim();
  if (!username) {
    alert("Будь ласка, введи ім’я!");
    return;
  }
  document.getElementById("intro").style.display = "none";
  document.getElementById("level").style.display = "block";
  startLevel();
}

function startLevel() {
  document.getElementById("feedback").textContent = "";
  document.getElementById("levelInfo").textContent =
    `Рівень ${currentLevel} — спроба ${currentAttempt} із ${attemptsPerLevel}`;
  document.getElementById("answer").value = "";
  document.getElementById("answer").disabled = true;
  document.getElementById("submitBtn").disabled = true;
  showSequence();
}

function showSequence() {
  const digitsCount = 3 + currentLevel - 1;
  let sequence = [];
  for (let i = 0; i < digitsCount; i++) {
    sequence.push(Math.floor(Math.random() * 10));
  }
  currentNumber = sequence.join("");
  const numberDiv = document.getElementById("number");

  let i = 0;
  const showNext = () => {
    if (i < sequence.length) {
      numberDiv.classList.remove("fade");
      numberDiv.textContent = sequence[i];
      i++;
      setTimeout(() => {
        numberDiv.classList.add("fade");
        setTimeout(showNext, 400);
      }, 700);
    } else {
      numberDiv.textContent = "";
      document.getElementById("answer").disabled = false;
      document.getElementById("submitBtn").disabled = false;
      document.getElementById("answer").focus();
    }
  };
  showNext();
}

function checkAnswer() {
  const userAnswer = document.getElementById("answer").value.trim();
  const correctAnswer = currentNumber.split("").reverse().join("");
  const feedback = document.getElementById("feedback");

  if (userAnswer === correctAnswer) {
    score++;
    feedback.textContent = "✅ Правильно!";
    feedback.className = "correct";
  } else {
    feedback.textContent = `❌ Неправильно. Правильна відповідь: ${correctAnswer}`;
    feedback.className = "wrong";
  }

  setTimeout(() => {
    if (currentAttempt < attemptsPerLevel) {
      currentAttempt++;
      startLevel();
    } else if (currentLevel < totalLevels) {
      currentLevel++;
      currentAttempt = 1;
      startLevel();
    } else {
      showResults();
    }
  }, 1200);
}

function showResults() {
  document.getElementById("level").style.display = "none";
  const accuracy = Math.round((score / totalAttempts) * 100);
  document.getElementById("result").style.display = "block";
  document.getElementById("result").innerHTML = `
    <h2>Результати</h2>
    <p>${username}, твоя точність: <strong>${accuracy}%</strong></p>
    <p>Правильних відповідей: ${score} із ${totalAttempts}</p>
    <button onclick="location.reload()">🔁 Пройти ще раз</button>
  `;
}
</script>
</body>
</html>
