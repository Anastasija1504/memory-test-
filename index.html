<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест на пам’ять</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #5b86e5, #36d1dc);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #game {
    max-width: 500px;
    margin: auto;
    background: rgba(0,0,0,0.25);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
  }
  input, button {
    padding: 10px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    margin: 10px;
  }
  input {
    width: 80%;
    text-align: center;
  }
  button {
    background: #fff;
    color: #333;
    cursor: pointer;
    transition: background 0.3s;
  }
  button:hover {
    background: #f0f0f0;
  }
  #number {
    font-size: 70px;
    font-weight: bold;
    margin: 20px 0;
    opacity: 0;
  }
  .flash {
    animation: flashEffect 0.4s ease-in-out;
  }
  @keyframes flashEffect {
    0% { opacity: 0; transform: scale(0.5); color: #fff; text-shadow: 0 0 15px #fff; }
    50% { opacity: 1; transform: scale(1.3); color: #ffff00; text-shadow: 0 0 30px #ff0; }
    100% { opacity: 1; transform: scale(1); color: #fff; text-shadow: 0 0 10px #fff; }
  }
  #feedback {
    font-size: 22px;
    margin-top: 10px;
    min-height: 35px;
    font-weight: bold;
  }
  .correct { color: #00ffb3; }
  .wrong { color: #ff4c4c; }
  #hint {
    font-style: italic;
    opacity: 0.8;
    font-size: 16px;
    margin-top: -5px;
  }
</style>
</head>
<body>
  <div id="game">
    <h1>🧠 Тест на пам’ять</h1>
    <div id="intro">
      <p>Введи своє ім’я:</p>
      <input type="text" id="username" placeholder="Твоє ім’я">
      <br>
      <button id="startBtn">Почати</button>
    </div>

    <div id="level" style="display:none;">
      <h2 id="levelInfo"></h2>
      <div id="number"></div>
      <div id="hint">🔁 Вводь у зворотному порядку!</div>
      <input id="answer" type="text" placeholder="Тут твоя відповідь" disabled>
      <br>
      <button id="submitBtn" disabled>Відповісти</button>
      <div id="feedback"></div>
    </div>

    <div id="result" style="display:none;"></div>
  </div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjlryvmhZq3VreJu3xTMbLgGUhWJq6gZQQtMtFQ2fvBFFk9eMTCGNppII3zO30SM7CZA/exec";

const totalLevels = 5;
const attemptsPerLevel = 3;
let currentLevel = 1;
let currentAttempt = 1;
let score = 0;
let totalAttempts = totalLevels * attemptsPerLevel;
let currentNumber = "";
let username = "";

document.getElementById("startBtn").onclick = startGame;
document.getElementById("submitBtn").onclick = checkAnswer;

function startGame() {
  username = document.getElementById("username").value.trim();
  if (!username) {
    alert("Будь ласка, введи ім’я!");
    return;
  }
  document.getElementById("intro").style.display = "none";
  document.getElementById("level").style.display = "block";
  startLevel();
}

async function startLevel() {
  document.getElementById("feedback").textContent = "";
  document.getElementById("levelInfo").textContent =
    `Рівень ${currentLevel} — спроба ${currentAttempt} із ${attemptsPerLevel}`;
  document.getElementById("answer").value = "";
  document.getElementById("answer").disabled = true;
  document.getElementById("submitBtn").disabled = true;

  currentNumber = generateNumber(currentLevel + 2);
  const reversedNumber = currentNumber.split("").reverse().join(""); // показуємо у зворотньому порядку
  await showNumbersSequentially(reversedNumber);

  // після показу всіх цифр — дозволяємо вводити
  document.getElementById("answer").disabled = false;
  document.getElementById("submitBtn").disabled = false;
  document.getElementById("answer").focus();
}

function generateNumber(length) {
  let num = "";
  for (let i = 0; i < length; i++) {
    num += Math.floor(Math.random() * 10);
  }
  return num;
}

function showNumbersSequentially(numberString) {
  const numberEl = document.getElementById("number");
  return new Promise((resolve) => {
    let i = 0;
    const interval = setInterval(() => {
      if (i >= numberString.length) {
        clearInterval(interval);
        numberEl.style.opacity = 0;
        resolve();
        return;
      }
      numberEl.textContent = numberString[i];
      numberEl.classList.add("flash");
      numberEl.style.opacity = 1;
      setTimeout(() => {
        numberEl.style.opacity = 0;
        numberEl.classList.remove("flash");
      }, 600);
      i++;
    }, 1000);
  });
}

function checkAnswer() {
  const userAnswer = document.getElementById("answer").value.trim();
  const correctAnswer = currentNumber; // правильна — оригінальний порядок
  const feedback = document.getElementById("feedback");

  if (userAnswer === correctAnswer) {
    score++;
    feedback.textContent = "✅ Правильно!";
    feedback.className = "correct";
  } else {
    feedback.textContent = `❌ Неправильно! Правильна відповідь: ${correctAnswer}`;
    feedback.className = "wrong";
  }

  currentAttempt++;
  if (currentAttempt > attemptsPerLevel) {
    currentAttempt = 1;
    currentLevel++;
  }

  if (currentLevel > totalLevels) {
    setTimeout(endGame, 1500);
  } else {
    setTimeout(startLevel, 1500);
  }
}

function endGame() {
  document.getElementById("level").style.display = "none";
  const accuracy = Math.round((score / totalAttempts) * 100);
  const resultText = `
    <h2>Тест завершено!</h2>
    <p>${username}, твій результат: ${score} із ${totalAttempts}</p>
    <p>Точність: <b>${accuracy}%</b></p>
  `;
  document.getElementById("result").innerHTML = resultText;
  document.getElementById("result").style.display = "block";

  // 🔹 Надсилаємо результат у Google Таблицю
  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      name: username,
      correct: score,
      total: totalAttempts,
      accuracy: accuracy
    }),
    headers: { "Content-Type": "application/json" }
  }).then(r => console.log("Результат надіслано:", r.status));
}
</script>
</body>
</html>
